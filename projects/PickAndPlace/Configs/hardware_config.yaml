app:
  name: PickAndPlace
  version: 1.0.0
  machine: 10
hardware:
  leadshine:
    type: ethercat_card
    config:
      card_no: 0
      name: "Card EtherCAT Leadshine"
      axes:
        - id: AXIS_X
          name: AxisX
          axis_index: 0
          description: Pick X axis
        - id: AXIS_Y
          name: AxisY
          axis_index: 1
          description: Pick Y axis
        - id: AXIS_Z
          name: AxisZ
          axis_index: 2
          description: Pick Z axis
      data:
        - id: current_pos_x
          name: Pos X
          axis: 0
          type: int32
          default: 0
        - id: current_pos_y
          name: Pos Y
          axis: 1
          type: int32
          default: 0
      common_io:
        - id: emergency_stop
          name: EmergencyStop
          node_id: 3
          io_bit: 0
          address: 0
          direction: Input
          type: bit
          default: false
        - id: start_button
          name: StartButton
          node_id: 3
          io_bit: 1
          address: 0
          direction: Input
          type: bit
          default: false
        - id: stop_button
          name: StopButton
          node_id: 3
          io_bit: 2
          address: 0
          direction: Input
          type: bit
          default: false
        - id: reset_button
          name: ResetButton
          node_id: 3
          io_bit: 3
          address: 0
          direction: Input
          type: bit
          default: false
        - id: safety_door
          name: SafetyDoor
          node_id: 3
          io_bit: 4
          address: 0
          direction: Input
          type: bit
          default: false
        - id: air_pressure
          name: AirPressure
          node_id: 3
          io_bit: 5
          address: 0
          direction: Input
          type: bit
          default: false
        - id: home_button
          name: HomeButton
          node_id: 3
          io_bit: 6
          address: 0
          direction: Input
          type: bit
          default: false
        - id: auto_mode_switch
          name: AutoModeSwitch
          node_id: 3
          io_bit: 7
          address: 0
          direction: Input
          type: bit
          default: false
        - id: manual_mode_switch
          name: ManualModeSwitch
          node_id: 3
          io_bit: 8
          address: 0
          direction: Input
          type: bit
          default: false
        - id: material_low
          name: MaterialLow
          node_id: 3
          io_bit: 9
          address: 0
          direction: Input
          type: bit
          default: false
        - id: tower_light_red
          name: TowerLightRed
          node_id: 3
          io_bit: 0
          address: 0
          direction: Output
          type: bit
          default: false
        - id: tower_light_yellow
          name: TowerLightYellow
          node_id: 3
          io_bit: 1
          address: 0
          direction: Output
          type: bit
          default: false
        - id: tower_light_green
          name: TowerLightGreen
          node_id: 3
          io_bit: 2
          address: 0
          direction: Output
          type: bit
          default: false
        - id: buzzer
          name: Buzzer
          node_id: 3
          io_bit: 3
          address: 0
          direction: Output
          type: bit
          default: false
        - id: main_power_enable
          name: MainPowerEnable
          node_id: 3
          io_bit: 4
          address: 0
          direction: Output
          type: bit
          default: false
      io:
        - id: part_present
          name: PartPresent
          node_id: 3
          io_bit: 10
          address: 0
          direction: Input
          type: bit
          default: false
        - id: test_ok
          name: TestOk
          node_id: 3
          io_bit: 11
          address: 0
          direction: Input
          type: bit
          default: false
        - id: test_ng
          name: TestNg
          node_id: 3
          io_bit: 12
          address: 0
          direction: Input
          type: bit
          default: false
        - id: cylinder_extended
          name: CylinderExtended
          node_id: 3
          io_bit: 13
          address: 0
          direction: Input
          type: bit
          default: false
        - id: cylinder_retracted
          name: CylinderRetracted
          node_id: 3
          io_bit: 14
          address: 0
          direction: Input
          type: bit
          default: false
        - id: vacuum_ok
          name: VacuumOk
          node_id: 3
          io_bit: 15
          address: 0
          direction: Input
          type: bit
          default: false
        - id: cylinder_extend
          name: CylinderExtend
          node_id: 3
          io_bit: 10
          address: 0
          direction: Output
          type: bit
          default: false
        - id: vacuum_on
          name: VacuumOn
          node_id: 3
          io_bit: 11
          address: 0
          direction: Output
          type: bit
          default: false
  keyence:
    type: keyence
    config:
      ip: "192.168.0.10"
      port: 8501
      name: "KeyencePLC"
      data:
        - id: nhiet_do
          name: Nhiet do
          address: D1200
          type: int32
          default: 0
      common_io:
        - id: stop_plc
          name: StopButton
          address: M100
          direction: Input
          type: bit
          default: false
      io:
        - id: sensor_load
          name: SensorLoad
          address: M200
          direction: Input
          type: bit
          default: false

